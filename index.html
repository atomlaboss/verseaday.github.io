<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Verse</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="themeSwitcher">
        <button class="themeBtn" onclick="setTheme('papyrus')" title="Papyrus">📜</button>
        <button class="themeBtn" onclick="setTheme('green')" title="Green">🌿</button>
        <button class="themeBtn" onclick="setTheme('royal')" title="Royal Blue">👑</button>
        <button class="themeBtn" onclick="setTheme('dark')" title="Dark">🌙</button>
    </div>

    <h1>Random Verse</h1>

    <div class="loader" id="loadingCircle"></div>
    <p id="verse"></p>
    <p id="translation"></p>

    <button id="randomBtn" onclick="getRandomAyah()">New Verse</button>

    <script src="main.js"></script>

    <footer>
        Vibe coded by Adam Labas. Inspired by <a href="https://github.com/Wah-hab/wah-hab.github.io" target="_blank" rel="noopener">Random Quran Verse</a> by Abdulwahab Humayun
    </footer>
</body>
</html>
